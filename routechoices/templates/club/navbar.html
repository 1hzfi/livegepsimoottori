{% load define_action hosts static %}
{% if event.club %}
    {% define event.club as club %}
{% endif %}
<header id="event-navbar" class="navbar navbar-expand-md navbar-dark bg-primary"
        style="z-index: 110001;
               padding: 3px 0;
               color: #fff;
               background-color: #111 !important">
    <div class="container">
        <a class="navbar-brand site-name m-0 pe-2" href="/">
        {% if club.logo %}
            <span class="d-inline-block">
                <img src="{{ club.logo_url }}"
                     alt="{{ club.name }}'s logo"
                     height="40"
                     width="40"
                     style="margin-top: -10px;
                            margin-bottom: -7px"
                     class="rounded">
            </span>
        {% else %}
            <span class="d-inline-block">
                <img src="{% static 'img/logo.png' %}{{ engine_version_static_cache_buster }}"
                     alt="Site logo"
                     height="40"
                     width="40"
                     style="margin-top: -10px;
                            margin-bottom: -7px">
            </span>
        {% endif %}
        </a>
        {% if club %}
            <span class="text-nowrap overflow-hidden d-inline-block text-truncate"
                  style="max-width: calc(100% - 120px);font-weight: 700;"
                  title="{% if is_event_page %}{{ event.name }}{% else %}{{ club.name }}{% endif %}">
                {% if is_event_page %}
                    {{ event.name }}
                {% else %}
                    {{ club.name }}
                {% endif %}
            </span>
            <div class="navbar" id="navbarNav">
                <ul class="nav navbar-nav me-auto mb-2 mb-lg-0">
                </ul>
                <ul class="nav navbar-nav d-flex flex-nowrap">
                    <li class="nav-item">
                        <button class="theme-selector" type="button" data-bs-toggle="tooltip">
                            <svg aria-hidden="true" class="theme-selector-icon">
                                <use xlink:href="#icon-auto"></use>
                            </svg>
                        </button>
                    </li>
                </ul>
            </div>
        {% endif %}
    </div>
</header>
<div id="django-messages">
    <div id="text-too-many-runners" class="alert alert-warning alert-dismissible fade d-none" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-2"></i><span class="text-too-many-runners-content"></span>
        <button aria-label="Close" class="btn-close" data-bs-dismiss="alert" type="button"></button>
    </div>
</div>
