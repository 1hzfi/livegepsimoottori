services:
  db:
    container_name: rc_db
    image: postgres:18
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: changeme
    restart: always
    expose:
      - "5432"
  e2edb:
    container_name: rc_e2e_db
    image: postgres:18
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: changeme
    restart: always
    expose:
      - "5432"
  s3:
    container_name: rc_filestore
    image: ghcr.io/versity/versitygw:latest
    volumes:
      - ../media/s3:/data/s3
      - ../media/versioning:/data/versioning
      - ../media/iam:/data/iam
      - ../media/sidecar:/data/sidecar
    expose:
      - "9000"
    ports:
      - 9000:9000
    environment:
      ROOT_ACCESS_KEY: minio
      ROOT_SECRET_KEY: minio123
      VGW_PORT: ":9000"
      VGW_IAM_DIR: /data/iam
      VGW_VERSIONING_DIR: /data/versioning
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/s3
      VGW_META_SIDECAR: /data/sidecar
      VGW_CORS_ALLOW_ORIGIN: "*"
    restart: unless-stopped
  smtp:
    container_name: rc_mailpit
    image: axllent/mailpit:latest
    expose:
      - "1025"
    ports:
      - 8025:8025
    volumes:
      - ../media:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  nginx:
    container_name: rc_nginx
    image: rphlo/nginx:latest
    ports:
      - "443:443/udp"
      - "443:443/tcp"
    volumes:
      - ../static:/static:ro
      - ../letsencrypt/:/etc/nginx/ssl:ro
      - ../nginx/routechoices.conf:/etc/nginx/http.d/routechoices.conf:ro
    links:
      - s3
      - django
    command: [
      'nginx',
      '-g',
      'daemon off;'
    ]
    build:
      context: "."
      platforms:
        - "linux/amd64"
  django:
    container_name: rc_django
    image: rphlo/routechoices-dev-server:latest
    stop_signal: SIGINT
    volumes:
      - ../:/app/:rw
      - ../bin/:/app/bin/
    links:
      - db
      - s3
      - smtp
    command: [
      "gunicorn",
      "--bind",
      ":8000",
      "--workers",
      "${NUM_PROCESSES:-3}",
      "--reload",
      "routechoices.${WSGI_FILE:-wsgi}:application",
    ]
